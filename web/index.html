<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>L Battle</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: Inter, 'Microsoft YaHei', system-ui, sans-serif;
                color: #f2f5f7;
                background: #0b1013;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            button,
            input,
            select {
                font: inherit;
            }
            button {
                cursor: pointer;
            }

            .game-shell,
            .viewport,
            #stage {
                width: 100%;
                height: 100%;
            }
            .viewport {
                position: relative;
                overflow: hidden;
                background: #819984;
            }
            #stage canvas {
                display: block;
            }

            .top-status {
                position: absolute;
                top: 0;
                left: 50%;
                z-index: 4;
                display: flex;
                align-items: center;
                gap: 18px;
                min-height: 34px;
                padding: 5px 18px;
                color: #d7e0e4;
                background: rgba(7, 12, 15, 0.86);
                border-bottom: 1px solid #51616a;
                transform: translateX(-50%);
                white-space: nowrap;
                font-size: 12px;
            }

            .top-status strong {
                color: #fff;
            }
            .connection-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #d8a73d;
            }

            .dev-tools {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 8;
                width: min(330px, calc(100vw - 20px));
                color: #dfe7e9;
                font-size: 12px;
            }

            .dev-tools summary {
                width: 36px;
                height: 36px;
                display: grid;
                place-items: center;
                list-style: none;
                border: 1px solid #667780;
                background: rgba(7, 12, 15, 0.88);
                cursor: pointer;
                font-size: 18px;
            }

            .dev-tools summary::-webkit-details-marker {
                display: none;
            }
            .dev-tools[open] summary {
                width: 100%;
                justify-content: start;
                padding-left: 11px;
            }
            .dev-tools[open] summary::after {
                content: ' 战斗工具';
                font-size: 12px;
                font-weight: 700;
            }

            .tool-body {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 10px;
                background: rgba(7, 12, 15, 0.94);
                border: 1px solid #667780;
                border-top: 0;
            }

            .tool-body label {
                display: grid;
                gap: 4px;
                color: #aebbc0;
            }
            .tool-body .wide {
                grid-column: 1 / -1;
            }
            .tool-body input,
            .tool-body select {
                width: 100%;
                min-width: 0;
                height: 32px;
                padding: 0 8px;
                color: #eef3f5;
                border: 1px solid #4d5c63;
                border-radius: 2px;
                background: #172126;
            }

            .tool-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .tool-actions button {
                min-height: 32px;
                color: #f5f8f8;
                border: 1px solid #62737b;
                border-radius: 2px;
                background: #26353c;
            }
            .tool-actions button:hover {
                background: #34474f;
            }
            #connectBtn {
                border-color: #2a9d70;
                background: #176446;
            }
            #leaveBtn {
                border-color: #a94b4b;
                background: #6b2929;
            }
            .target-strip {
                position: absolute;
                top: 46px;
                right: 16px;
                z-index: 4;
                display: none;
                width: 220px;
                padding: 8px;
                border-top: 2px solid #d85858;
                background: rgba(8, 13, 16, 0.86);
                font-size: 11px;
            }

            .target-heading {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                color: #fff;
            }
            .target-heading span {
                overflow: hidden;
                color: #8f9da2;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .target-vitals {
                display: grid;
                gap: 2px;
                margin: 6px 0 7px;
            }
            .target-vitals .vital,
            .target-vitals .vital.resource {
                height: 12px;
            }
            .target-vitals .vital span {
                font-size: 9px;
            }
            .target-debuffs {
                display: grid;
                gap: 4px;
                margin-bottom: 7px;
                padding: 6px 0;
                border-top: 1px solid #5f3838;
                border-bottom: 1px solid #405057;
            }
            .target-section-title {
                color: #f29b9b;
                font-weight: 800;
            }
            .target-debuff-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) max-content;
                gap: 8px;
                color: #dce5e7;
            }
            .target-debuff-row > span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .target-debuff-row b {
                margin-right: 5px;
                color: #ff8585;
            }
            .target-attributes {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5px 4px;
                padding-top: 7px;
                border-top: 1px solid #405057;
            }
            .target-strip .attribute {
                grid-template-columns: 18px 1fr;
                gap: 3px;
                font-size: 11px;
            }
            .target-strip .attribute-icon {
                font-size: 14px;
            }
            .target-strip .armor-icon {
                width: 13px;
                height: 15px;
            }
            .target-strip .magic-resist-icon {
                width: 13px;
                height: 13px;
                border-width: 2px;
            }

            .hud {
                position: absolute;
                left: 50%;
                bottom: 0;
                z-index: 5;
                display: grid;
                grid-template-columns: 86px minmax(310px, 470px) 150px;
                align-items: end;
                width: min(710px, calc(100vw - 300px));
                min-height: 138px;
                background: linear-gradient(180deg, rgba(17, 25, 30, 0.94), rgba(5, 9, 12, 0.98));
                border: 1px solid #64747c;
                border-bottom: 0;
                box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.36);
                transform: translateX(-50%);
            }

            .portrait-block {
                align-self: stretch;
                display: grid;
                grid-template-rows: 1fr auto;
                border-right: 1px solid #526169;
                background: #111a1f;
            }

            .portrait {
                display: grid;
                place-items: center;
                color: #d9c276;
                background: radial-gradient(circle at 50% 38%, #35454d, #121a1e 68%);
                font-size: 34px;
                font-weight: 900;
            }

            .portrait-meta {
                display: flex;
                justify-content: space-between;
                padding: 5px 7px;
                font-size: 11px;
                color: #b9c5c9;
            }
            .portrait-meta b {
                color: #f2d36e;
            }

            .combat-center {
                min-width: 0;
                padding: 9px 10px 8px;
            }
            .vitals {
                display: grid;
                gap: 3px;
                margin-bottom: 8px;
            }
            .vital {
                position: relative;
                height: 14px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.3);
                background: #101619;
            }
            .vital.resource {
                height: 14px;
            }
            .vital-fill {
                height: 100%;
                width: 0;
                transition: width 0.12s linear;
            }
            .vital.hp .vital-fill {
                background: #2eaa5f;
            }
            .vital.resource .vital-fill {
                background: #2585c7;
            }
            .vital span {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                color: #fff;
                text-shadow: 0 1px 2px #000;
                font-size: 10px;
                font-weight: 800;
                line-height: 1;
            }

            #skills .skill-list {
                display: grid;
                grid-template-columns: repeat(5, minmax(48px, 1fr));
                gap: 5px;
            }
            .skill-row {
                position: relative;
                display: grid;
                place-items: center;
                align-content: center;
                min-width: 0;
                height: 48px;
                padding: 5px 3px;
                overflow: visible;
                border: 1px solid #65757c;
                background: linear-gradient(145deg, #28383f, #10181c);
                font-size: 10px;
            }
            .skill-row > strong {
                color: #f6e1a0;
                font-size: 17px;
                line-height: 1;
            }
            .skill-row > span {
                color: #b9c6ca;
                white-space: nowrap;
            }
            .skill-row > span:not(.stat-tip):nth-of-type(n + 3) {
                display: none;
            }
            .skill-row .stat-tip {
                position: absolute;
                right: 3px;
                bottom: 3px;
            }
            .skill-row > .stat-tip {
                display: inline-grid;
            }
            .skill-row .icon-button {
                position: absolute;
                top: -7px;
                right: -4px;
                width: 18px;
                height: 18px;
                padding: 0;
                color: #12181b;
                border: 1px solid #f4d36b;
                border-radius: 50%;
                background: #f0c94f;
                font-weight: 900;
            }
            .skill-row .icon-button:disabled {
                display: none;
            }

            .inventory {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 4px;
            }
            .inventory-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 36px;
                gap: 5px;
                margin-top: 7px;
            }
            .equipment-slot-row {
                position: relative;
                min-width: 0;
            }
            .equipment-slot-row button {
                width: 100%;
                height: 32px;
                padding: 2px;
                overflow: hidden;
                color: #cbd5d8;
                border: 1px solid #56666d;
                border-radius: 2px;
                background: #162126;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 9px;
            }
            .equipment-slot-row button.selected {
                border-color: #e8c75d;
                box-shadow: inset 0 0 0 1px #e8c75d;
            }
            .equipment-slot-row button:disabled {
                cursor: default;
                color: #59666b;
            }
            .equipment-slot-row .stat-tip {
                position: absolute;
                right: 2px;
                bottom: 2px;
                z-index: 2;
            }
            .shop-toggle {
                width: 36px;
                height: 32px;
                padding: 0;
                color: #f1cf68;
                border: 1px solid #7d713f;
                border-radius: 2px;
                background: #18251f;
                font-size: 18px;
            }
            .shop-toggle:hover {
                background: #24372e;
            }

            .attribute-panel {
                align-self: stretch;
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-content: center;
                gap: 9px 7px;
                padding: 12px 8px;
                border-left: 1px solid #526169;
                background: rgba(14, 22, 26, 0.82);
            }
            .attribute {
                display: grid;
                grid-template-columns: 22px 1fr;
                align-items: center;
                gap: 4px;
                min-width: 0;
                color: #f0f3f4;
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            .attribute-icon {
                color: #d5bd6e;
                font-size: 17px;
                text-align: center;
            }
            .attack-icon {
                color: #e68a32;
            }
            .ability-power-icon {
                color: #a56de2;
            }
            .crit-icon {
                color: #e05252;
            }
            .armor-icon,
            .magic-resist-icon {
                display: block;
                justify-self: center;
            }
            .armor-icon {
                width: 15px;
                height: 17px;
                background: #d8b43f;
                clip-path: polygon(50% 0, 94% 18%, 84% 70%, 50% 100%, 16% 70%, 6% 18%);
            }
            .magic-resist-icon {
                width: 15px;
                height: 15px;
                border: 3px solid #4aa9dc;
                border-radius: 50%;
            }
            .attribute-value {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .minimap-wrap {
                position: absolute;
                right: 12px;
                bottom: 12px;
                z-index: 5;
                width: min(236px, 22vw);
                aspect-ratio: 1;
                border: 2px solid #7a898f;
                background: #18261f;
                box-shadow: 0 0 0 3px rgba(5, 9, 12, 0.7);
            }
            #minimap {
                display: block;
                width: 100%;
                height: 100%;
            }

            #buffs {
                position: absolute;
                left: 50%;
                bottom: 146px;
                z-index: 5;
                display: flex;
                max-width: 520px;
                transform: translateX(-50%);
            }
            #buffs > .skill-list {
                display: flex;
                gap: 5px;
            }
            #buffs .status-groups,
            #buffs .status-group {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            #buffs .status-groups {
                gap: 9px;
            }
            #buffs .status-heading {
                color: #aebcc1;
                font-size: 10px;
                font-weight: 800;
            }
            #buffs .buff-row,
            #buffs .skill-row {
                display: flex;
                width: auto;
                height: 28px;
                gap: 5px;
                padding: 4px 7px;
                border: 1px solid #66767d;
                background: rgba(7, 12, 15, 0.9);
                font-size: 10px;
            }
            #buffs .status-group.debuff .buff-row {
                border-color: #a95555;
            }
            #buffs .status-group.buff .buff-row {
                border-color: #477c61;
            }
            #buffs .status-icon {
                margin-right: 4px;
                color: #f6d365;
            }

            .stat-tip {
                display: inline-grid;
                width: 14px;
                height: 14px;
                place-items: center;
                color: #dde6e8;
                border: 1px solid #718188;
                border-radius: 50%;
                font-size: 9px;
                cursor: help;
            }
            .stat-tip:hover::after {
                content: attr(data-tip);
                position: absolute;
                left: 50%;
                bottom: calc(100% + 7px);
                z-index: 30;
                width: max-content;
                max-width: 310px;
                padding: 7px 9px;
                color: #f5f7f8;
                background: rgba(5, 9, 12, 0.97);
                border: 1px solid #718188;
                transform: translateX(-50%);
                white-space: pre-line;
                pointer-events: none;
                font-size: 11px;
                line-height: 1.5;
            }

            .data-only {
                display: none !important;
            }

            .shop-overlay {
                position: absolute;
                inset: 0;
                z-index: 9;
                display: grid;
                place-items: end center;
                padding: 12px 12px 150px;
                background: rgba(2, 7, 9, 0.54);
            }
            .shop-overlay[hidden] {
                display: none;
            }
            .shop-window {
                display: grid;
                grid-template-rows: 48px minmax(0, 1fr);
                width: min(920px, 100%);
                height: min(560px, 100%);
                overflow: hidden;
                border: 1px solid #60766d;
                background: rgba(7, 15, 17, 0.98);
                box-shadow: 0 12px 42px rgba(0, 0, 0, 0.55);
            }
            .shop-header {
                display: grid;
                grid-template-columns: max-content minmax(180px, 1fr) max-content 34px;
                align-items: center;
                gap: 12px;
                padding: 7px 10px;
                border-bottom: 1px solid #425850;
                background: #10201f;
            }
            .shop-header h2 {
                margin: 0;
                color: #e6d38b;
                font-size: 15px;
                letter-spacing: 0;
            }
            .shop-search {
                width: 100%;
                height: 32px;
                padding: 0 10px;
                color: #edf4f2;
                border: 1px solid #496158;
                border-radius: 2px;
                outline: 0;
                background: #091311;
            }
            .shop-search:focus {
                border-color: #c5aa57;
            }
            .shop-gold {
                color: #f2cf64;
                font-size: 13px;
                font-weight: 800;
                white-space: nowrap;
            }
            .shop-close {
                width: 32px;
                height: 32px;
                padding: 0;
                color: #dce7e3;
                border: 1px solid #53675f;
                border-radius: 2px;
                background: #182724;
                font-size: 20px;
            }
            .shop-body {
                display: grid;
                grid-template-columns: 124px minmax(0, 1fr) 250px;
                min-height: 0;
            }
            .shop-categories {
                display: grid;
                grid-template-rows: repeat(5, auto) minmax(8px, 1fr) auto;
                align-content: stretch;
                gap: 3px;
                padding: 10px 8px;
                border-right: 1px solid #344a43;
                background: #0b1816;
            }
            .shop-category {
                min-height: 34px;
                padding: 0 9px;
                color: #aebdb7;
                border: 0;
                border-left: 2px solid transparent;
                border-radius: 0;
                background: transparent;
                text-align: left;
            }
            .shop-category:hover,
            .shop-category.selected {
                color: #f1dd95;
                border-left-color: #c5a84d;
                background: #142723;
            }
            .shop-inventory {
                grid-row: 7;
                min-width: 0;
                padding-top: 9px;
                border-top: 1px solid #344a43;
            }
            .shop-inventory-title {
                margin-bottom: 6px;
                color: #91a39c;
                font-size: 10px;
            }
            .shop-inventory-slots {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 4px;
            }
            .shop-equipment-slot {
                height: 40px;
                min-width: 0;
                padding: 3px;
                overflow: hidden;
                color: #cbd5d8;
                border: 1px solid #435952;
                border-radius: 2px;
                background: #101d1b;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 9px;
            }
            .shop-equipment-slot:hover:not(:disabled) {
                border-color: #81958d;
                background: #172824;
            }
            .shop-equipment-slot.selected {
                color: #f1dd95;
                border-color: #e8c75d;
                box-shadow: inset 0 0 0 1px #e8c75d;
            }
            .shop-equipment-slot:disabled {
                cursor: default;
                color: #52615c;
                opacity: 0.7;
            }
            .shop-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
                align-content: start;
                gap: 8px;
                min-width: 0;
                padding: 12px;
                overflow: auto;
            }
            .shop-item {
                display: grid;
                grid-template-rows: 42px 1.25em 1.25em;
                place-items: center;
                min-width: 0;
                min-height: 84px;
                padding: 5px;
                color: #dbe5e1;
                border: 1px solid #3f5650;
                border-radius: 2px;
                background: #101d1b;
                font-size: 10px;
            }
            .shop-item:hover,
            .shop-item.selected {
                border-color: #c3a650;
                background: #192b27;
            }
            .shop-item-icon {
                display: grid;
                width: 38px;
                height: 38px;
                place-items: center;
                color: #eef4f1;
                border: 1px solid #61776e;
                background: #253a34;
                font-size: 20px;
            }
            .shop-item-icon[data-category='physical'] {
                color: #f0bc68;
                background: #3b2b21;
            }
            .shop-item-icon[data-category='magic'] {
                color: #91d5ff;
                background: #1d3441;
            }
            .shop-item-icon[data-category='defense'] {
                color: #b8d2bd;
                background: #28382e;
            }
            .shop-item-icon[data-category='shoes'] {
                color: #dfc4ff;
                background: #352b41;
            }
            .shop-item strong,
            .shop-item span {
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .shop-item-price {
                color: #e2c35f;
            }
            .shop-empty {
                grid-column: 1 / -1;
                padding: 24px;
                color: #83938d;
                text-align: center;
            }
            .shop-detail {
                display: grid;
                grid-template-rows: minmax(0, 1fr) auto;
                min-height: 0;
                border-left: 1px solid #344a43;
                background: #0a1513;
            }
            .shop-detail-content {
                padding: 16px;
                overflow: auto;
                color: #b8c6c1;
                font-size: 12px;
                line-height: 1.6;
            }
            .shop-detail-title {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
                color: #f0dfa1;
            }
            .shop-detail-title strong {
                font-size: 16px;
            }
            .shop-detail-price {
                color: #e7c65e;
                font-weight: 800;
            }
            .shop-components {
                margin-top: 14px;
                padding-top: 10px;
                border-top: 1px solid #344a43;
                color: #91a39c;
            }
            .shop-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 7px;
                padding: 10px;
                border-top: 1px solid #344a43;
            }
            .shop-actions button {
                height: 36px;
                overflow: hidden;
                color: #f0f5f2;
                border: 1px solid #5c7269;
                border-radius: 2px;
                background: #1d302b;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .shop-actions button:hover:not(:disabled) {
                background: #29453d;
            }
            .shop-actions button:disabled {
                cursor: default;
                opacity: 0.45;
            }
            .shop-status {
                grid-column: 1 / -1;
                min-height: 18px;
                color: #e6c664;
                font-size: 11px;
            }

            @media (max-width: 980px) {
                .hud {
                    left: 8px;
                    width: calc(100vw - 212px);
                    grid-template-columns: 70px minmax(280px, 1fr);
                    transform: none;
                }
                .attribute-panel {
                    position: absolute;
                    left: 0;
                    bottom: 100%;
                    display: grid;
                    width: 150px;
                    min-height: 110px;
                    border: 1px solid #526169;
                    background: rgba(7, 12, 15, 0.92);
                }
                .minimap-wrap {
                    width: 186px;
                }
            }
            @media (max-width: 700px) {
                .top-status {
                    top: 0;
                    right: 6px;
                    bottom: auto;
                    left: auto;
                    transform: none;
                }
                .hud {
                    width: calc(100vw - 10px);
                    left: 5px;
                    grid-template-columns: 62px minmax(0, 1fr);
                }
                .minimap-wrap {
                    right: 6px;
                    bottom: 150px;
                    width: 128px;
                }
                #buffs {
                    bottom: 145px;
                }
                .target-strip {
                    right: 6px;
                    width: min(220px, calc(100vw - 12px));
                }
                .shop-overlay {
                    padding: 8px;
                }
                .shop-window {
                    height: 100%;
                }
                .shop-header {
                    grid-template-columns: max-content minmax(100px, 1fr) 30px;
                    gap: 6px;
                }
                .shop-gold {
                    display: none;
                }
                .shop-body {
                    grid-template-columns: 82px minmax(0, 1fr);
                    grid-template-rows: minmax(0, 1fr) 138px;
                }
                .shop-categories {
                    min-height: 0;
                    padding-right: 5px;
                    padding-left: 5px;
                    overflow-y: auto;
                }
                .shop-category {
                    padding: 0 3px;
                    white-space: nowrap;
                    font-size: 10px;
                }
                .shop-inventory-title {
                    text-align: center;
                }
                .shop-equipment-slot {
                    height: 34px;
                    padding: 1px;
                    font-size: 8px;
                }
                .shop-detail {
                    grid-column: 1 / -1;
                    grid-template-columns: minmax(0, 1fr) 180px;
                    grid-template-rows: 1fr;
                    border-top: 1px solid #344a43;
                    border-left: 0;
                }
                .shop-detail-content {
                    padding: 9px;
                }
                .shop-actions {
                    align-content: center;
                    border-top: 0;
                    border-left: 1px solid #344a43;
                }
                .shop-actions button {
                    font-size: 11px;
                }
            }
        </style>
    </head>
    <body>
        <main class="game-shell viewport">
            <div id="stage"></div>

            <div class="top-status" aria-live="polite">
                <span class="connection-dot" aria-hidden="true"></span>
                <span><strong id="status">未连接</strong></span>
                <span>玩家 <strong id="playerCount">0</strong></span>
                <span id="teamLabel">-</span>
                <span id="position">-</span>
                <span id="tick" hidden>0</span>
            </div>

            <details class="dev-tools">
                <summary title="战斗工具" aria-label="战斗工具">⚙</summary>
                <div class="tool-body">
                    <label class="wide">服务器<input id="serverUrl" readonly /></label>
                    <label>房间<input id="roomId" value="demo-room" readonly /></label>
                    <label>玩家<input id="playerId" maxlength="16" /></label>
                    <label
                        >英雄<select id="heroId">
                            <option value="sword">剑客</option>
                        </select></label
                    >
                    <label
                        >阵营<select id="team">
                            <option value="blue">蓝色</option>
                            <option value="red">红色</option>
                        </select></label
                    >
                    <label
                        >生成<select id="spawnKind">
                            <option value="enemy_hero">敌方英雄</option>
                            <option value="melee_minion">近战小兵</option>
                            <option value="ranged_minion">远程小兵</option>
                            <option value="siege_minion">炮车小兵</option>
                            <option value="tower">防御塔</option>
                            <option value="barracks">兵营</option>
                            <option value="crystal">水晶</option>
                        </select></label
                    >
                    <label
                        >生成阵营<select id="spawnTeam">
                            <option value="red">红色</option>
                            <option value="blue">蓝色</option>
                            <option value="neutral">中立</option>
                        </select></label
                    >
                    <div class="tool-actions wide">
                        <button id="connectBtn">连接</button><button id="leaveBtn">离开</button>
                        <button id="spawnBtn">生成</button><button id="levelUpBtn">等级 +1</button>
                        <button id="abilityHasteBtn">+200 急速</button><button id="goldBtn">+10000 金币</button>
                    </div>
                </div>
            </details>

            <div class="target-cards target-strip">
                <div id="target">-</div>
            </div>

            <div id="buffs">-</div>

            <section class="hud" aria-label="英雄战斗界面">
                <div class="portrait-block">
                    <div id="heroPortrait" class="portrait" title="英雄头像">英</div>
                    <div class="portrait-meta">
                        <span>Lv <b id="statLevel">-</b></span
                        ><span>◈ <b id="equipGold">-</b></span>
                    </div>
                </div>

                <div class="combat-center">
                    <div class="vitals">
                        <div class="vital hp">
                            <div id="hudHpFill" class="vital-fill"></div>
                            <span id="statHp">-</span>
                        </div>
                        <div class="vital resource">
                            <div id="hudResourceFill" class="vital-fill"></div>
                            <span id="statMp">-</span>
                        </div>
                    </div>
                    <div id="skills">-</div>
                    <div class="inventory-row">
                        <div class="inventory" aria-label="物品栏">
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip1"></span><button id="equipment1">-</button></span
                            >
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip2"></span><button id="equipment2">-</button></span
                            >
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip3"></span><button id="equipment3">-</button></span
                            >
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip4"></span><button id="equipment4">-</button></span
                            >
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip5"></span><button id="equipment5">-</button></span
                            >
                            <span class="equipment-slot-row"
                                ><span id="equipmentTip6"></span><button id="equipment6">-</button></span
                            >
                        </div>
                        <button
                            id="shopToggleBtn"
                            class="shop-toggle"
                            type="button"
                            title="打开商店"
                            aria-label="打开商店"
                        >
                            🛒
                        </button>
                    </div>
                </div>

                <div class="attribute-panel" aria-label="英雄属性">
                    <div class="attribute" title="攻击力">
                        <span class="attribute-icon attack-icon">⚔</span
                        ><span id="statAttack" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="法术强度">
                        <span class="attribute-icon ability-power-icon">✦</span
                        ><span id="statAbilityPower" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="物理防御">
                        <span class="attribute-icon armor-icon" aria-hidden="true"></span
                        ><span id="statPhysicalDefense" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="魔法防御">
                        <span class="attribute-icon magic-resist-icon" aria-hidden="true"></span
                        ><span id="statMagicDefense" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="攻击速度">
                        <span class="attribute-icon">»</span><span id="statAttackSpeed" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="冷却">
                        <span class="attribute-icon">◷</span
                        ><span id="statAbilityHaste" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="暴击率">
                        <span class="attribute-icon crit-icon">✹</span
                        ><span id="statCritChance" class="attribute-value">-</span>
                    </div>
                    <div class="attribute" title="移动速度">
                        <span class="attribute-icon">➤</span><span id="statMoveSpeed" class="attribute-value">-</span>
                    </div>
                </div>
            </section>

            <div class="minimap-wrap" aria-label="小地图"><canvas id="minimap"></canvas></div>

            <div id="shopOverlay" class="shop-overlay" hidden>
                <section class="shop-window" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
                    <header class="shop-header">
                        <h2 id="shopTitle">装备商店</h2>
                        <input
                            id="shopSearch"
                            class="shop-search"
                            type="search"
                            placeholder="搜索物品"
                            autocomplete="off"
                        />
                        <span class="shop-gold">◈ <span id="shopGold">-</span></span>
                        <button
                            id="shopCloseBtn"
                            class="shop-close"
                            type="button"
                            title="关闭商店"
                            aria-label="关闭商店"
                        >
                            ×
                        </button>
                    </header>
                    <div class="shop-body">
                        <nav class="shop-categories" aria-label="物品分类">
                            <button class="shop-category selected" type="button" data-shop-category="all">
                                所有物品
                            </button>
                            <button class="shop-category" type="button" data-shop-category="physical">⚔ 物理</button>
                            <button class="shop-category" type="button" data-shop-category="magic">✦ 法术</button>
                            <button class="shop-category" type="button" data-shop-category="defense">⬟ 防御</button>
                            <button class="shop-category" type="button" data-shop-category="shoes">➤ 鞋子</button>
                            <div class="shop-inventory" aria-label="我的装备">
                                <div class="shop-inventory-title">我的装备</div>
                                <div id="shopEquipmentSlots" class="shop-inventory-slots"></div>
                            </div>
                        </nav>
                        <div id="shopGrid" class="shop-grid" aria-label="商品列表"></div>
                        <aside class="shop-detail">
                            <div id="shopDetail" class="shop-detail-content">选择一件物品查看详情</div>
                            <div class="shop-actions">
                                <select id="shopItem" hidden aria-hidden="true"></select>
                                <button id="buyEquipmentBtn" type="button" disabled>购买</button>
                                <button id="sellEquipmentBtn" type="button" disabled>出售选中</button>
                                <div class="shop-status">商店：<span id="shopStatus">-</span></div>
                            </div>
                        </aside>
                    </div>
                </section>
            </div>

            <div class="data-only" aria-hidden="true">
                <span id="statExp">-</span><span id="statSkillPoints">-</span> <span id="statResourceLabel">资源</span
                ><span id="statResource">-</span><span id="statMpLabel">法力</span> <span id="statHpRegen5">-</span
                ><span id="statMpRegen5Label">法力/5秒</span><span id="statMpRegen5">-</span>
                <span id="statAbilityHasteTip"></span><span id="statPhysicalDefenseTip"></span
                ><span id="statMagicDefenseTip"></span> <span id="statAttackRange">-</span
                ><span id="statCritChanceTip"></span> <span id="statOmnivamp">-</span><span id="statLifeSteal">-</span
                ><span id="statHealingPower">-</span>
            </div>
        </main>

        <script type="module" src="/js/main.js?v=20260728-2"></script>
    </body>
</html>
